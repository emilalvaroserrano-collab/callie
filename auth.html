<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080d1a">
<title>CSR Studio · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#080d1a;
  --panel:rgba(18,26,44,.82);
  --panel2:#182339;
  --input:rgba(11,17,31,.88);
  --outline:rgba(66,86,122,.45);
  --outline2:rgba(79,102,143,.58);
  --muted:#95a6c1;
  --text:#eff5ff;
  --mint:#72dfbf;
  --mint-ink:#072d25;
  --danger:#ff94a4;
  --danger-bg:rgba(72,30,44,.88);
  --danger-border:rgba(175,82,108,.65);
  font-family:"Roboto",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);overflow-x:clip;max-width:100%;-webkit-text-size-adjust:100%}
body{min-height:100dvh;display:flex;flex-direction:column}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

/* Modern wavy gradient background */
.bg-canvas{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(ellipse 65% 50% at 85% 10%,rgba(94,92,255,.22),transparent 65%),
    radial-gradient(ellipse 60% 55% at 10% 90%,rgba(47,200,157,.20),transparent 65%),
    linear-gradient(145deg,#070b17 0%,#0d152a 52%,#091828 100%);
}
.bg-orb{position:absolute;border-radius:50%;filter:blur(75px);opacity:.65}
.orb-1{width:480px;height:480px;top:-140px;right:-100px;background:radial-gradient(circle,rgba(116,105,255,.35),transparent 70%)}
.orb-2{width:460px;height:460px;bottom:-150px;left:-110px;background:radial-gradient(circle,rgba(63,219,181,.30),transparent 70%)}
.bg-waves{position:absolute;inset:0;width:100%;height:100%}

/* Auth loading splash (prevents form flash when auto-redirecting signed-in users) */
.auth-splash{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 40%,rgba(26,56,74,.7),#080d1a 70%);
  transition:opacity .2s ease,visibility .2s ease;
}
.auth-splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{
  width:56px;height:56px;border-radius:17px;
  display:grid;place-items:center;
  background:#182b3d;border:1px solid rgba(114,223,191,.35);
  color:var(--mint);
}
.splash-logo svg{width:28px;height:28px}
.loader{
  width:26px;height:26px;border-radius:50%;
  border:2.5px solid rgba(114,223,191,.22);border-top-color:var(--mint);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Desktop two-panel webview container */
.shell{
  position:relative;z-index:1;
  flex:1;width:100%;max-width:1080px;
  margin:0 auto;padding:28px 24px;
  display:grid;place-items:center;
}
.two-panel{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);
  background:var(--panel);
  border:1px solid var(--outline);
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 28px 80px rgba(0,0,0,.48);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
}

/* Left Showcase Panel */
.panel-visual{
  position:relative;
  padding:48px 44px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(160deg,rgba(16,24,42,.96),rgba(10,16,30,.98));
  border-right:1px solid var(--outline);
}
.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:760;letter-spacing:-.3px}
.brand-icon{
  width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#193146,#1a223b);
  border:1px solid rgba(124,185,204,.35);
  color:var(--mint);
}
.brand-icon svg{width:22px;height:22px}

.visual-center{margin:auto 0;padding:28px 0}
.visual-center h1{
  margin:0 0 14px;
  font-size:clamp(32px,3.2vw,42px);
  letter-spacing:-1px;line-height:1.15;
  font-weight:700;
}
.visual-center h1 span{color:var(--mint)}
.visual-subtitle{
  margin:0;
  max-width:28ch;
  font-size:15px;
  line-height:1.6;
  color:var(--muted);
  font-weight:400;
}

/* Right Auth Panel */
.panel-form{
  padding:38px 36px;
  display:flex;flex-direction:column;justify-content:center;
}
.mobile-brand{display:none}
.form-head{margin-bottom:20px}
.form-head h2{margin:0;font-size:24px;letter-spacing:-.6px}

.tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  padding:5px;border-radius:12px;
  background:var(--input);border:1px solid var(--outline);
  margin-bottom:18px;
}
.tab-btn{
  height:40px;border:0;border-radius:9px;
  background:transparent;color:var(--muted);
  font-size:13px;font-weight:700;
  transition:background .15s,color .15s;
}
.tab-btn.active{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px rgba(105,134,180,.35)}

.google-btn{
  width:100%;height:48px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  border-radius:12px;border:1px solid #d9e2ef;
  background:#ffffff;color:#111827;
  font-size:14px;font-weight:700;
  transition:filter .15s,transform .15s;
}
.google-btn:hover{filter:brightness(.96)}
.google-btn:active{transform:scale(.99)}
.google-btn svg{width:19px;height:19px;flex:none}

.divider{
  display:flex;align-items:center;gap:12px;
  margin:18px 0;color:#7d8fa9;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--outline)}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:650;color:#c7d6e9}
.field-row{display:flex;justify-content:space-between;align-items:center}
.input-wrap{position:relative;display:flex;align-items:center}
.field input{
  width:100%;height:46px;padding:0 13px;
  border-radius:11px;background:var(--input);
  border:1px solid var(--outline2);color:var(--text);
  font-size:14px;transition:border-color .18s,box-shadow .18s;
}
.input-wrap input{padding-right:44px}
.field input::placeholder{color:#61718c}
.field input:focus{border-color:#68d6bd;box-shadow:0 0 0 3px rgba(114,223,191,.13);outline:0}
.toggle-pw{
  position:absolute;right:6px;width:34px;height:34px;
  border:0;border-radius:8px;background:transparent;color:var(--muted);
  display:grid;place-items:center;
}
.toggle-pw:hover{color:var(--text);background:rgba(37,52,78,.6)}
.toggle-pw svg{width:17px;height:17px}

.link-btn{border:0;background:none;padding:0;color:var(--mint);font-size:12px;font-weight:600}
.link-btn:hover{text-decoration:underline}

.primary-btn{
  margin-top:4px;width:100%;height:48px;border:0;border-radius:12px;
  background:linear-gradient(105deg,#7de7ca,#62d4b5);
  color:var(--mint-ink);font-size:14px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:filter .15s,transform .15s;
}
.primary-btn:hover{filter:brightness(1.06)}
.primary-btn:active{transform:scale(.99)}

.alert{
  display:none;padding:11px 13px;border-radius:11px;
  font-size:12.5px;line-height:1.45;margin-bottom:14px;
}
.alert.show{display:block}
.alert.error{background:var(--danger-bg);border:1px solid var(--danger-border);color:#ffd5dc}
.alert.info{background:rgba(20,58,56,.88);border:1px solid rgba(72,158,140,.65);color:#ccfff1}
.hidden{display:none!important}

/* Native Mobile Interface (<= 900px) */
@media(max-width:900px){
  html,body{overflow-x:clip;width:100%;max-width:100%;touch-action:pan-y;overflow-y:auto}
  .shell{
    padding:0;max-width:none;min-height:100dvh;
    display:flex;flex-direction:column;justify-content:flex-start;
  }
  .two-panel{
    flex:1;display:flex;flex-direction:column;
    border:0;border-radius:0;background:transparent;
    box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  .panel-visual{display:none}
  .panel-form{
    flex:1;
    padding:calc(26px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
    justify-content:flex-start;
  }
  .mobile-brand{
    display:flex;align-items:center;gap:11px;
    margin-bottom:26px;
  }
  .mobile-brand .brand-icon{width:42px;height:42px;border-radius:13px}
  .mobile-brand span{font-size:18px;font-weight:780;letter-spacing:-.3px}
  .form-head{margin-bottom:18px}
  .form-head h2{font-size:26px;letter-spacing:-.7px}
  .tabs{background:rgba(12,18,34,.75);border-radius:14px;padding:5px}
  .tab-btn{height:42px;font-size:14px}
  .google-btn{height:52px;border-radius:14px;font-size:15px}
  .field input{height:50px;border-radius:13px;font-size:16px;background:rgba(11,17,31,.82)}
  .primary-btn{height:52px;border-radius:14px;font-size:15px;margin-top:8px}
}
</style>
</head>
<body>
<div class="bg-canvas" aria-hidden="true">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <svg class="bg-waves" viewBox="0 0 1440 900" preserveAspectRatio="none">
    <defs>
      <linearGradient id="aw1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#72dfbf" stop-opacity="0.18"/>
        <stop offset="55%" stop-color="#5876ff" stop-opacity="0.11"/>
        <stop offset="100%" stop-color="#9e87ff" stop-opacity="0.04"/>
      </linearGradient>
      <linearGradient id="aw2" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6ee7c8" stop-opacity="0.13"/>
        <stop offset="100%" stop-color="#283d8a" stop-opacity="0.05"/>
      </linearGradient>
    </defs>
    <path fill="url(#aw1)" d="M0,560 C240,455 440,670 720,575 C1000,480 1210,355 1440,445 L1440,900 L0,900 Z"/>
    <path fill="url(#aw2)" d="M0,695 C320,765 560,550 860,645 C1140,730 1290,590 1440,635 L1440,900 L0,900 Z"/>
    <path fill="none" stroke="#72dfbf" stroke-opacity="0.16" stroke-width="1.5" d="M0,560 C240,455 440,670 720,575 C1000,480 1210,355 1440,445"/>
    <path fill="none" stroke="#8ea2ff" stroke-opacity="0.13" stroke-width="1.5" d="M0,695 C320,765 560,550 860,645 C1140,730 1290,590 1440,635"/>
  </svg>
</div>

<div class="auth-splash" id="authSplash" role="status" aria-live="polite" aria-label="Checking session">
  <div class="splash-logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></svg>
  </div>
  <div class="loader" aria-hidden="true"></div>
</div>

<main class="shell">
  <div class="two-panel">
    <!-- Left Panel (Webview) -->
    <section class="panel-visual" aria-hidden="true">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></svg>
        </div>
        <span>CSR <span style="color:var(--mint)">Studio</span></span>
      </div>

      <div class="visual-center">
        <h1>Voice AI,<br><span>simplified.</span></h1>
        <p class="visual-subtitle">A modern workspace for seamless conversations.</p>
      </div>
    </section>

    <!-- Right Panel (Webview) / Native Fullscreen View (Mobile) -->
    <section class="panel-form" aria-live="polite">
      <div class="mobile-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></svg>
        </div>
        <span>CSR <span style="color:var(--mint)">Studio</span></span>
      </div>

      <div class="form-head">
        <h2 id="authTitle">Sign in</h2>
      </div>

      <div class="alert" id="alertBox" role="alert"></div>

      <div class="tabs" role="tablist" aria-label="Authentication mode">
        <button class="tab-btn active" id="tabSignIn" type="button" role="tab" aria-selected="true">Sign in</button>
        <button class="tab-btn" id="tabSignUp" type="button" role="tab" aria-selected="false">Sign up</button>
      </div>

      <button class="google-btn" id="googleBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.27 14.29A7.21 7.21 0 0 1 4.9 12c0-.79.14-1.56.37-2.29V6.62H1.29A11.98 11.98 0 0 0 0 12c0 1.94.46 3.77 1.29 5.38l3.98-3.09z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="divider"><span>or</span></div>

      <form class="form" id="authForm" novalidate>
        <div class="field hidden" id="nameFieldWrap">
          <label for="fullName">Full name</label>
          <input id="fullName" type="text" autocomplete="name" maxlength="80" placeholder="Marco Reyes">
        </div>

        <div class="field hidden" id="companyFieldWrap">
          <label for="companyInput">Company</label>
          <input id="companyInput" type="text" autocomplete="organization" maxlength="100" placeholder="TechSolutions">
        </div>

        <div class="field">
          <label for="emailInput">Email</label>
          <input id="emailInput" type="email" inputmode="email" autocomplete="email" maxlength="160" placeholder="you@company.com" required>
        </div>

        <div class="field">
          <div class="field-row">
            <label for="passwordInput">Password</label>
            <button class="link-btn" id="forgotBtn" type="button">Forgot?</button>
          </div>
          <div class="input-wrap">
            <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" maxlength="128" placeholder="••••••••" required>
            <button class="toggle-pw" id="togglePw" type="button" aria-label="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="primary-btn" id="submitBtn" type="submit">
          <span id="submitLabel">Sign in</span>
        </button>
      </form>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  getRedirectResult,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updateProfile,
  sendPasswordResetEmail,
  onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';
import {
  getDatabase,
  ref,
  get,
  update,
  serverTimestamp
} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js';

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCHErUyhBxmwFpKJ4b7QaRmEYaiLm-rjDA",
  authDomain: "csr-studio.firebaseapp.com",
  databaseURL: "https://csr-studio-default-rtdb.firebaseio.com",
  projectId: "csr-studio",
  storageBucket: "csr-studio.firebasestorage.app",
  messagingSenderId: "990796119326",
  appId: "1:990796119326:web:f4a3df85569d4bd7e89d0f",
  measurementId: "G-4YDHQGKD3P"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });

const $ = id => document.getElementById(id);
let mode = 'signin';
let busy = false;
let authFlowInProgress = false;

if (location.protocol === 'file:') {
  $('authSplash').classList.add('hidden');
  showAlert('Serve over http://localhost or https:// for Firebase Auth.', 'error');
}

function showAlert(msg, type = 'error') {
  const box = $('alertBox');
  if (!msg) { box.className = 'alert'; box.textContent = ''; return; }
  box.textContent = msg;
  box.className = `alert show ${type}`;
}

function setMode(nextMode) {
  mode = nextMode;
  const isSignup = mode === 'signup';
  $('tabSignIn').classList.toggle('active', !isSignup);
  $('tabSignUp').classList.toggle('active', isSignup);
  $('tabSignIn').setAttribute('aria-selected', String(!isSignup));
  $('tabSignUp').setAttribute('aria-selected', String(isSignup));
  $('nameFieldWrap').classList.toggle('hidden', !isSignup);
  $('companyFieldWrap').classList.toggle('hidden', !isSignup);
  $('forgotBtn').classList.toggle('hidden', isSignup);
  $('authTitle').textContent = isSignup ? 'Create account' : 'Sign in';
  $('submitLabel').textContent = isSignup ? 'Create account' : 'Sign in';
  $('passwordInput').autocomplete = isSignup ? 'new-password' : 'current-password';
  showAlert('');
}

function setBusy(state, label = '') {
  busy = state;
  $('googleBtn').disabled = state;
  $('submitBtn').disabled = state;
  $('tabSignIn').disabled = state;
  $('tabSignUp').disabled = state;
  $('submitLabel').textContent = state
    ? (label || (mode === 'signup' ? 'Creating…' : 'Signing in…'))
    : (mode === 'signup' ? 'Create account' : 'Sign in');
}

function friendlyError(err) {
  const map = {
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/user-not-found': 'No account found for this email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/email-already-in-use': 'Email already registered. Sign in instead.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/invalid-email': 'Enter a valid email address.',
    'auth/too-many-requests': 'Too many attempts. Try again shortly.',
    'auth/popup-closed-by-user': 'Google sign-in was closed.',
    'auth/network-request-failed': 'Network error. Check your connection.',
    'auth/unauthorized-domain': 'Domain not authorized in Firebase Auth.'
  };
  return map[err?.code] || err?.message || 'Authentication failed.';
}

async function saveUserProfileToRTDB(user, extras = {}) {
  const userRef = ref(db, `users/${user.uid}`);
  let existing = null;
  try {
    const snap = await get(userRef);
    if (snap.exists()) existing = snap.val();
  } catch (e) {}

  const primaryProvider = user.providerData?.[0]?.providerId || (user.email ? 'password' : 'unknown');
  const displayName = (extras.displayName ?? user.displayName ?? existing?.displayName ?? (user.email ? user.email.split('@')[0] : 'User')).trim();
  const company = (extras.company ?? existing?.company ?? '').trim();

  await update(userRef, {
    uid: user.uid,
    email: user.email || existing?.email || '',
    displayName,
    company,
    photoURL: user.photoURL || existing?.photoURL || '',
    provider: primaryProvider,
    providers: (user.providerData || []).map(p => p.providerId).filter(Boolean),
    emailVerified: Boolean(user.emailVerified),
    createdAt: existing?.createdAt || serverTimestamp(),
    lastLoginAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });
}

function goHome() {
  window.location.replace('index.html');
}

$('tabSignIn').addEventListener('click', () => setMode('signin'));
$('tabSignUp').addEventListener('click', () => setMode('signup'));

$('togglePw').addEventListener('click', () => {
  const inp = $('passwordInput');
  const hidden = inp.type === 'password';
  inp.type = hidden ? 'text' : 'password';
  $('togglePw').setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  $('eyeIcon').innerHTML = hidden
    ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.52M1 1l22 22"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

$('googleBtn').addEventListener('click', async () => {
  if (busy) return;
  showAlert('');
  authFlowInProgress = true;
  setBusy(true, 'Connecting…');
  try {
    const res = await signInWithPopup(auth, googleProvider);
    await saveUserProfileToRTDB(res.user);
    goHome();
  } catch (err) {
    if (err?.code === 'auth/popup-blocked' || err?.code === 'auth/operation-not-supported-in-this-environment') {
      try {
        await signInWithRedirect(auth, googleProvider);
        return;
      } catch (redirectErr) {
        showAlert(friendlyError(redirectErr), 'error');
      }
    } else {
      showAlert(friendlyError(err), 'error');
    }
    authFlowInProgress = false;
    setBusy(false);
  }
});

$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  showAlert('');

  const email = $('emailInput').value.trim();
  const password = $('passwordInput').value;
  const fullName = $('fullName').value.trim();
  const company = $('companyInput').value.trim();

  if (mode === 'signup' && !fullName) {
    showAlert('Enter your full name.', 'error');
    $('fullName').focus();
    return;
  }
  if (!email) {
    showAlert('Enter your email address.', 'error');
    $('emailInput').focus();
    return;
  }
  if (!password || (mode === 'signup' && password.length < 6)) {
    showAlert(mode === 'signup' ? 'Password must be at least 6 characters.' : 'Enter your password.', 'error');
    $('passwordInput').focus();
    return;
  }

  authFlowInProgress = true;
  setBusy(true);
  try {
    if (mode === 'signup') {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: fullName });
      await saveUserProfileToRTDB(cred.user, { displayName: fullName, company });
    } else {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      await saveUserProfileToRTDB(cred.user);
    }
    goHome();
  } catch (err) {
    authFlowInProgress = false;
    setBusy(false);
    showAlert(friendlyError(err), 'error');
  }
});

$('forgotBtn').addEventListener('click', async () => {
  const email = $('emailInput').value.trim();
  if (!email) {
    showAlert('Enter your email above first.', 'error');
    $('emailInput').focus();
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    showAlert(`Reset link sent to ${email}.`, 'info');
  } catch (err) {
    showAlert(friendlyError(err), 'error');
  }
});

getRedirectResult(auth).catch(err => {
  $('authSplash').classList.add('hidden');
  showAlert(friendlyError(err), 'error');
});

onAuthStateChanged(auth, async user => {
  if (authFlowInProgress) return;
  if (user) {
    try { await saveUserProfileToRTDB(user); } catch (e) {}
    goHome();
  } else {
    $('authSplash').classList.add('hidden');
  }
});
</script>
</body>
</html>
