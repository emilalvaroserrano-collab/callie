services:
  whatsapp:
    build:
      context: ./whatsapp-service
    image: csr-whatsapp:latest
    container_name: csr-whatsapp
    restart: unless-stopped
    env_file:
      - ./whatsapp-service/.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - whatsapp_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  whatsapp_data:
